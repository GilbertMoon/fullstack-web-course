<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.t{font-size:42px;font-weight:bold;fill:#0f172a}.h{font-size:29px;font-weight:700;fill:#0f172a}.p{font-size:21px;fill:#334155}.m{font-family:Consolas,monospace;font-size:23px;fill:#1d4ed8}</style><text x="76" y="88" class="t">6강 — Next.js 목록·상세 페이지 라우팅</text><text x="76" y="131" class="p">목록에서 회원 이름 선택 → URL 이동 → 해당 회원을 GET으로 조회합니다.</text><rect x="86" y="218" width="560" height="366" rx="25" fill="white" stroke="#93c5fd" stroke-width="3"/><rect x="86" y="218" width="560" height="65" rx="25" fill="#dbeafe"/><text x="117" y="260" class="m">/members</text><text x="120" y="338" class="h">회원 목록</text><text x="120" y="394" class="p">Kim · ID 1</text><rect x="109" y="413" width="502" height="74" rx="15" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="143" y="460" class="h">Lee · ID 2 · 상세 보기</text><text x="120" y="543" class="p">Park · ID 3</text><path d="M664 401H779" stroke="#6366f1" stroke-width="7"/><path d="M765 389L782 401L765 414" stroke="#6366f1" stroke-width="6" fill="none"/><text x="720" y="367" text-anchor="middle" class="p">Link 이동</text><rect x="796" y="218" width="560" height="366" rx="25" fill="white" stroke="#a7f3d0" stroke-width="3"/><rect x="796" y="218" width="560" height="65" rx="25" fill="#d1fae5"/><text x="823" y="260" class="m">/members/2</text><text x="824" y="338" class="h">회원 상세</text><text x="824" y="396" class="p">회원 ID: 2</text><text x="824" y="439" class="p">이름: Lee · 나이: 27세</text><text x="824" y="482" class="p">이메일: lee@example.com</text><text x="824" y="542" class="p">← 회원 목록으로</text><rect x="88" y="632" width="1267" height="138" rx="22" fill="#eef2ff"/><text x="720" y="675" class="h" text-anchor="middle">app/members/page.tsx → app/members/[memberId]/page.tsx</text><text x="720" y="716" class="p" text-anchor="middle">상세 화면에서 FastAPI GET /members/2 → PostgreSQL → JSON 응답</text><text x="83" y="815" class="p">설명용 이미지입니다. 실제 회원 ID와 상세 응답은 Swagger와 Browser Network에서 확인합니다.</text></svg>