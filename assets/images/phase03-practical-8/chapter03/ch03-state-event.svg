<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820"><rect width="1440" height="820" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.title{font-size:46px;font-weight:800;fill:#0f172a}.sub{font-size:24px;fill:#475569}.head{font-size:29px;font-weight:700;fill:#0f172a}.body{font-size:23px;fill:#334155}.code{font-family:Consolas,'Malgun Gothic',monospace;font-size:22px;fill:#1e40af}</style><text x="75" y="88" class="title">React State · Event · 화면 갱신 흐름</text><text x="75" y="133" class="sub">검색어를 입력하면 React가 값을 기억하고 회원 목록을 다시 계산합니다.</text><rect x="65" y="203" width="1310" height="480" rx="26" fill="white" stroke="#cbd5e1" stroke-width="3"/><rect x="102" y="294" width="258" height="170" rx="23" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/><text x="231" y="348" class="head" text-anchor="middle">사용자 입력</text><text x="231" y="396" class="code" text-anchor="middle">lee</text><text x="231" y="434" class="body" text-anchor="middle">검색창 입력</text><path d="M369 376H437" stroke="#4f46e5" stroke-width="7"/><path d="M424 363L443 376L424 390" stroke="#4f46e5" stroke-width="7" fill="none"/><rect x="455" y="294" width="264" height="170" rx="23" fill="#ede9fe" stroke="#c4b5fd" stroke-width="3"/><text x="587" y="348" class="head" text-anchor="middle">Event</text><text x="587" y="393" class="code" text-anchor="middle">onChange</text><text x="587" y="430" class="body" text-anchor="middle">setSearch 호출</text><path d="M728 376H796" stroke="#4f46e5" stroke-width="7"/><path d="M783 363L802 376L783 390" stroke="#4f46e5" stroke-width="7" fill="none"/><rect x="813" y="294" width="254" height="170" rx="23" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/><text x="940" y="348" class="head" text-anchor="middle">State 변경</text><text x="940" y="393" class="code" text-anchor="middle">search = "lee"</text><text x="940" y="430" class="body" text-anchor="middle">검색어를 기억</text><path d="M1075 376H1143" stroke="#4f46e5" stroke-width="7"/><path d="M1130 363L1149 376L1130 390" stroke="#4f46e5" stroke-width="7" fill="none"/><rect x="1163" y="294" width="174" height="170" rx="23" fill="#dcfce7" stroke="#86efac" stroke-width="3"/><text x="1250" y="343" class="head" text-anchor="middle" style="font-size:26px">화면 갱신</text><text x="1250" y="394" class="body" text-anchor="middle">Lee 1명</text><text x="1250" y="429" class="body" text-anchor="middle">목록 표시</text><rect x="146" y="533" width="1148" height="91" rx="20" fill="#f1f5f9"/><text x="720" y="569" text-anchor="middle" class="code">filteredMembers → members Props → MemberList</text><text x="720" y="601" text-anchor="middle" class="body">검색어에 맞는 회원만 선택해 기존 카드 컴포넌트 재사용</text><text x="80" y="754" class="sub">※ 아직 FastAPI 요청이나 DB 저장을 수행하지 않습니다. 화면의 샘플 데이터만 필터링합니다.</text></svg>