<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940"><rect width="1440" height="940" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.title{font-size:46px;font-weight:800;fill:#0f172a}.sub{font-size:24px;fill:#475569}.head{font-size:29px;font-weight:700;fill:#0f172a}.body{font-size:23px;fill:#334155}.code{font-family:Consolas,'Malgun Gothic',monospace;font-size:22px;fill:#1e40af}</style><text x="65" y="80" class="title">3강 — 회원 검색과 입력 폼 미리보기</text><text x="65" y="121" class="sub">검색어 lee · 회원 목록 1명 · 입력값은 즉시 표시, 저장하지 않음</text><rect x="70" y="157" width="1300" height="709" rx="24" fill="white" stroke="#cbd5e1" stroke-width="3"/><rect x="70" y="157" width="1300" height="65" rx="24" fill="#e2e8f0"/><circle cx="108" cy="188" r="9" fill="#ef4444"/><circle cx="139" cy="188" r="9" fill="#facc15"/><circle cx="169" cy="188" r="9" fill="#22c55e"/><rect x="263" y="170" width="800" height="39" rx="12" fill="white"/><text x="291" y="198" class="body" style="font-size:19px">localhost:3000</text><text x="118" y="277" class="head">회원관리 시스템 · 03강</text><text x="118" y="322" class="body">검색 (이름 또는 이메일)</text><rect x="118" y="343" width="485" height="61" rx="12" fill="white" stroke="#94a3b8" stroke-width="2"/><text x="145" y="383" class="head">lee</text><rect x="622" y="343" width="131" height="61" rx="12" fill="#eef2ff" stroke="#a5b4fc"/><text x="687" y="382" text-anchor="middle" class="body">초기화</text><text x="118" y="475" class="head">회원 목록 (1명)</text><rect x="118" y="497" width="625" height="125" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="145" y="542" class="head">Lee</text><text x="145" y="581" class="body">lee@example.com · 나이 27세 · ID 2</text><rect x="802" y="261" width="515" height="519" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/><text x="830" y="306" class="head">회원 등록 연습 (미리보기)</text><text x="830" y="340" class="body" style="font-size:19px">아직 저장 기능이 없습니다.</text><text x="830" y="390" class="body">이름</text><rect x="830" y="404" width="451" height="47" rx="9" fill="white" stroke="#94a3b8"/><text x="847" y="436" class="body">Hong</text><text x="830" y="483" class="body">이메일</text><rect x="830" y="495" width="451" height="47" rx="9" fill="white" stroke="#94a3b8"/><text x="847" y="527" class="body">hong@example.com</text><text x="830" y="575" class="body">나이</text><rect x="830" y="589" width="451" height="47" rx="9" fill="white" stroke="#94a3b8"/><text x="847" y="621" class="body">25</text><rect x="830" y="657" width="205" height="47" rx="9" fill="#e0e7ff"/><text x="933" y="690" text-anchor="middle" class="body">입력값 확인</text><text x="830" y="740" class="body" style="font-size:19px">현재 입력값: Hong / hong@example.com / 25세</text><rect x="117" y="695" width="625" height="85" rx="16" fill="#fffbeb" stroke="#fcd34d"/><text x="148" y="735" class="body">폼 입력은 회원 목록을 변경하지 않습니다.</text><text x="148" y="766" class="body" style="font-size:18px">실제 등록·DB 저장은 5강에서 구현합니다.</text><text x="85" y="911" class="sub">설명용 SVG 화면 예시 · 실제 브라우저 실행 캡처가 아닙니다.</text></svg>