<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800"><rect width="1440" height="800" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#17233d}.title{font-size:43px;font-weight:800}.sub{font-size:22px;fill:#475569}.head{font-size:29px;font-weight:700}.body{font-size:23px}.note{font-size:19px;fill:#475569}</style><text x="72" y="85" class="title">회원관리 서비스 전체 구조</text><text x="72" y="132" class="sub">Phase 03에서는 기존 FastAPI·PostgreSQL을 그대로 활용하고 React·Next.js 화면을 연결합니다.</text><rect x="60" y="224" width="390" height="350" rx="25" fill="#dbeafe" stroke="#60a5fa" stroke-width="3"/><text x="255" y="284" text-anchor="middle" class="head">① 사용자 화면</text><text x="255" y="330" text-anchor="middle" class="body">Next.js + React</text><text x="255" y="365" text-anchor="middle" class="body">TypeScript</text><rect x="93" y="400" width="325" height="118" rx="16" fill="white"/><text x="255" y="444" text-anchor="middle" class="body">회원 목록 · 검색 · 상세</text><text x="255" y="484" text-anchor="middle" class="body">등록 · 수정 · 삭제</text><rect x="525" y="224" width="390" height="350" rx="25" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/><text x="720" y="284" text-anchor="middle" class="head">② 백엔드 서버</text><text x="720" y="332" text-anchor="middle" class="body">FastAPI (Python)</text><rect x="560" y="398" width="320" height="120" rx="16" fill="white"/><text x="720" y="445" text-anchor="middle" class="body">API 요청 처리 · 검증</text><text x="720" y="485" text-anchor="middle" class="body">회원 CRUD</text><rect x="990" y="224" width="390" height="350" rx="25" fill="#dcfce7" stroke="#4ade80" stroke-width="3"/><text x="1185" y="284" text-anchor="middle" class="head">③ 데이터베이스</text><text x="1185" y="332" text-anchor="middle" class="body">PostgreSQL</text><rect x="1024" y="398" width="322" height="120" rx="16" fill="white"/><text x="1185" y="445" text-anchor="middle" class="body">회원 정보 저장</text><text x="1185" y="485" text-anchor="middle" class="body">수정 · 삭제 · 재조회</text><path d="M457 384H514M500 372l14 12-14 12M922 384h57m-14-12 14 12-14 12" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="486" y="345" text-anchor="middle" class="note">HTTP</text><text x="950" y="345" text-anchor="middle" class="note">SQL</text><rect x="70" y="628" width="1300" height="96" rx="16" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="720" y="671" text-anchor="middle" class="body">예시: 회원 등록 버튼 → POST 요청 → DB 저장 → GET 재조회 → 화면 갱신</text><text x="720" y="702" text-anchor="middle" class="note">개념 설명용 도식이며 실제 프로그램 실행 성공을 증명하는 화면은 아닙니다.</text></svg>