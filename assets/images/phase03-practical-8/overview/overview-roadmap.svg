<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#17233d}.title{font-size:43px;font-weight:800}.sub{font-size:22px;fill:#475569}.head{font-size:27px;font-weight:750}.body{font-size:20px}.num{font-size:26px;font-weight:bold;fill:#4338ca}.foot{font-size:20px;fill:#475569}</style><text x="66" y="84" class="title">8강 실습 로드맵 — 하나의 회원관리 앱을 누적 완성</text><text x="66" y="129" class="sub">앞에서 만든 기능을 유지하면서 다음 단계의 기능을 추가하고, 마지막에 검증·제출합니다.</text><rect x="60" y="180" width="1320" height="145" rx="20" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/><text x="88" y="219" class="head">1~3강 · 화면 기초</text><g class="body"><text x="94" y="261">01 개발환경과 첫 페이지</text><text x="520" y="261">02 컴포넌트와 회원 카드</text><text x="1000" y="261">03 검색 · 입력 폼</text></g><rect x="60" y="342" width="1320" height="145" rx="20" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/><text x="88" y="381" class="head">4~5강 · 실제 API와 연결</text><text x="94" y="430" class="body">04 FastAPI GET 목록 조회</text><text x="700" y="430" class="body">05 회원 등록 · 수정 · 삭제 (CRUD)</text><rect x="60" y="504" width="1320" height="145" rx="20" fill="#dcfce7" stroke="#86efac" stroke-width="2"/><text x="88" y="543" class="head">6~8강 · 페이지 이동·검증·제출</text><text x="94" y="590" class="body">06 회원 목록 ↔ 상세 이동</text><text x="520" y="590" class="body">07 오류 · CORS · 통합 검증</text><text x="1000" y="590" class="body">08 README · 제출</text><path d="M720 328v11m-9-8 9 8 9-8M720 489v12m-9-8 9 8 9-8" stroke="#6366f1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="690" width="1320" height="88" rx="15" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="720" y="727" text-anchor="middle" class="body">최종 결과: Next.js 회원관리 화면 + 기존 FastAPI + PostgreSQL</text><text x="720" y="758" text-anchor="middle" class="foot">학습용 로드맵 · 실제 기능 동작과 제출 여부는 각 강의 실습 후 검증합니다.</text></svg>