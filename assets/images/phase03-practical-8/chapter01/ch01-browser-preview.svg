<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#eef2ff"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#0f172a}.title{font-weight:800;font-size:52px}.head{font-weight:700;font-size:27px}.body{font-size:22px}.muted{fill:#64748b;font-size:19px}</style><rect x="75" y="55" width="1290" height="740" rx="24" fill="white" stroke="#cbd5e1" stroke-width="3"/><rect x="75" y="55" width="1290" height="72" rx="24" fill="#e2e8f0"/><circle cx="118" cy="91" r="10" fill="#ef4444"/><circle cx="150" cy="91" r="10" fill="#eab308"/><circle cx="182" cy="91" r="10" fill="#22c55e"/><rect x="300" y="72" width="720" height="39" rx="13" fill="white"/><text x="323" y="99" font-size="18" fill="#475569">localhost:3000</text><rect x="120" y="170" width="1200" height="93" rx="18" fill="#eff6ff"/><text x="164" y="203" class="muted">Phase 03 · Full-stack 실습</text><text x="164" y="244" class="title" style="font-size:34px">회원관리 시스템</text><text x="120" y="326" class="title">회원관리 시스템</text><text x="120" y="374" class="body">React + Next.js + TypeScript로 화면을 만들고,</text><text x="120" y="407" class="body">이후 FastAPI와 PostgreSQL에 연결합니다.</text><rect x="120" y="453" width="1200" height="230" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/><text x="157" y="505" class="head">앞으로 만들 기능</text><text x="160" y="554" class="body">• 회원 목록 보기</text><text x="160" y="591" class="body">• 회원 검색하기</text><text x="680" y="554" class="body">• 회원 등록하기</text><text x="680" y="591" class="body">• 회원 수정·삭제하기</text><text x="160" y="643" class="muted">현재 단계: 01강 · 첫 화면 구성</text><text x="120" y="740" class="body">다음 단계: 02강에서 회원 카드와 회원 목록을 구현합니다.</text><rect x="1010" y="737" width="310" height="40" rx="12" fill="#fff7ed" stroke="#fdba74"/><text x="1032" y="763" font-size="17" fill="#9a3412">설명용 예시 · 실제 캡처 아님</text></svg>