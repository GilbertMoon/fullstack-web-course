<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940"><rect width="1500" height="940" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.title{font-size:43px;font-weight:800;fill:#0f172a}.sub{font-size:22px;fill:#475569}.head{font-size:29px;font-weight:700;fill:#0f172a}.body{font-size:20px;fill:#334155}.code{font-family:Consolas,monospace;font-size:21px;fill:#4338ca}</style><text x="70" y="90" class="title">4강 — 브라우저 Network 확인 방법</text><text x="70" y="132" class="sub">개발자 도구(F12) → Network → Fetch/XHR → 회원 GET 요청 선택</text><rect x="85" y="176" width="1330" height="678" rx="25" fill="white" stroke="#cbd5e1" stroke-width="3"/><rect x="85" y="176" width="1330" height="63" rx="25" fill="#e2e8f0"/><text x="120" y="218" class="head" style="font-size:24px">DevTools</text><text x="340" y="218" class="head" style="font-size:24px">Elements</text><rect x="510" y="186" width="165" height="46" rx="10" fill="#dbeafe"/><text x="592" y="218" class="head" style="font-size:24px" text-anchor="middle">Network</text><text x="720" y="218" class="head" style="font-size:24px">Console</text><text x="120" y="291" class="body">All</text><rect x="185" y="256" width="154" height="48" rx="13" fill="#e0e7ff"/><text x="262" y="289" class="body" text-anchor="middle">Fetch/XHR</text><line x1="120" y1="329" x2="1380" y2="329" stroke="#cbd5e1" stroke-width="2"/><text x="133" y="365" class="body">Name</text><text x="590" y="365" class="body">Method</text><text x="790" y="365" class="body">Status</text><text x="1020" y="365" class="body">Type</text><rect x="114" y="383" width="1270" height="70" rx="12" fill="#eff6ff"/><text x="132" y="426" class="head" style="font-size:24px">members</text><text x="605" y="426" class="body">GET</text><text x="806" y="426" class="body">200</text><text x="1028" y="426" class="body">fetch</text><text x="132" y="511" class="head">Headers</text><text x="300" y="511" class="head" style="fill:#64748b">Preview</text><text x="485" y="511" class="head" style="fill:#64748b">Response</text><line x1="130" y1="530" x2="1372" y2="530" stroke="#cbd5e1"/><text x="140" y="589" class="body">Request URL</text><text x="412" y="589" class="code">http://127.0.0.1:8000/members</text><text x="140" y="638" class="body">Request Method</text><text x="412" y="638" class="code">GET</text><text x="140" y="687" class="body">Status Code</text><text x="412" y="687" class="code">200 OK</text><rect x="126" y="740" width="1220" height="65" rx="12" fill="#fffbeb"/><text x="150" y="782" class="body">위 주소·상태는 예시입니다. 실제 URL, 응답 JSON, 상태 코드는 학생 PC에서 확인하세요.</text><text x="90" y="906" class="sub">설명용 Network 목업 · 실제 통신 결과나 테스트 PASS 증거가 아닙니다.</text></svg>