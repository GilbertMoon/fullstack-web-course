<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><rect width="1500" height="900" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.title{font-size:43px;font-weight:800;fill:#0f172a}.sub{font-size:22px;fill:#475569}.head{font-size:29px;font-weight:700;fill:#0f172a}.body{font-size:20px;fill:#334155}.code{font-family:Consolas,monospace;font-size:21px;fill:#4338ca}</style><text x="70" y="91" class="title">4강 — 회원 목록 API 요청·응답 흐름</text><text x="70" y="132" class="sub">React 화면은 FastAPI에 직접 GET 요청을 보내고, DB에서 조회된 JSON을 표시합니다.</text><rect x="70" y="235" width="380" height="235" rx="22" fill="#dbeafe" stroke="#a5b4fc" stroke-width="3"/><text x="260" y="282" class="head" text-anchor="middle">브라우저 · React</text><text x="260" y="319" class="body" text-anchor="middle">MemberWorkspace (use client)</text><text x="260" y="350" class="body" text-anchor="middle">fetch + useEffect</text><text x="260" y="381" class="body" text-anchor="middle">Loading / Empty / Error</text><rect x="575" y="235" width="350" height="235" rx="22" fill="#ede9fe" stroke="#a5b4fc" stroke-width="3"/><text x="750" y="282" class="head" text-anchor="middle">FastAPI</text><text x="750" y="319" class="body" text-anchor="middle">GET /members (예시)</text><text x="750" y="350" class="body" text-anchor="middle">요청 처리 · 데이터 검증</text><text x="750" y="381" class="body" text-anchor="middle">실제 경로는 Swagger 확인</text><rect x="1050" y="235" width="380" height="235" rx="22" fill="#dcfce7" stroke="#a5b4fc" stroke-width="3"/><text x="1240" y="282" class="head" text-anchor="middle">PostgreSQL</text><text x="1240" y="319" class="body" text-anchor="middle">회원 원본 데이터</text><text x="1240" y="350" class="body" text-anchor="middle">SQL / ORM 조회</text><text x="1240" y="381" class="body" text-anchor="middle">영구 저장</text><path d="M450 310L575 310" stroke="#6366f1" stroke-width="6" fill="none"/><path d="M562 299L575 310L562 321" stroke="#6366f1" stroke-width="5" fill="none"/><text x="512.5" y="294" class="body" text-anchor="middle">GET 요청</text><path d="M925 310L1050 310" stroke="#6366f1" stroke-width="6" fill="none"/><path d="M1037 299L1050 310L1037 321" stroke="#6366f1" stroke-width="5" fill="none"/><text x="987.5" y="294" class="body" text-anchor="middle">DB 조회</text><path d="M1050 414H925" stroke="#0d9488" stroke-width="6"/><path d="M938 402L925 414L938 426" fill="none" stroke="#0d9488" stroke-width="5"/><text x="988" y="397" class="body" text-anchor="middle">조회 결과</text><path d="M575 414H450" stroke="#0d9488" stroke-width="6"/><path d="M463 402L450 414L463 426" fill="none" stroke="#0d9488" stroke-width="5"/><text x="512" y="397" class="body" text-anchor="middle">JSON 응답</text><rect x="85" y="548" width="1330" height="170" rx="22" fill="white" stroke="#cbd5e1" stroke-width="2"/><text x="115" y="595" class="head">회원 목록 표시</text><text x="115" y="635" class="body">API 응답 Member[] → React State → 기존 MemberList → MemberCard</text><text x="115" y="674" class="body">성공 + 0명 = Empty / 응답 대기 = Loading / 요청 실패 = Error</text><text x="75" y="807" class="sub">설명용 아키텍처 · 실제 API/DB 조회 성공을 증명하는 캡처가 아닙니다.</text></svg>