<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  
<style>
  .bg{fill:#ffffff}.title{font:700 52px Arial,'Noto Sans KR',sans-serif;fill:#0f2747}
  .sub{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#16365f}
  .h{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:white}
  .t{font:600 24px Arial,'Noto Sans KR',sans-serif;fill:#17324d}
  .s{font:500 20px Arial,'Noto Sans KR',sans-serif;fill:#284965}
  .tiny{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#35536f}
  .blue{fill:#0d6efd}.teal{fill:#16a394}.pale{fill:#edf5ff}.mint{fill:#e9fbf7}
  .stroke{stroke:#195b9b;stroke-width:4}.stroke2{stroke:#139486;stroke-width:4}
  .line{stroke:#164e7e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{marker-end:url(#arrow)} .soft{filter:url(#shadow)}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#164e7e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
</defs><rect class="bg" width="1600" height="900"/>
  <text x="800" y="74" text-anchor="middle" class="title">Chapter 09 · Router → Service → Repository</text>
  <rect x="430" y="95" width="740" height="58" rx="29" fill="#dfeeff"/>
  <text x="800" y="134" text-anchor="middle" class="sub">백엔드 3계층 역할 분리</text>
  
  <rect x="70" y="310" width="220" height="250" rx="26" class="pale stroke"/><text x="180" y="360" text-anchor="middle" class="t">클라이언트 요청</text><text x="180" y="415" text-anchor="middle" class="s">POST /orders</text>
  <rect x="350" y="220" width="300" height="430" rx="28" class="pale stroke"/><rect x="350" y="220" width="300" height="75" rx="28" class="blue"/><text x="500" y="267" text-anchor="middle" class="h">Router</text>
  <text x="500" y="365" text-anchor="middle" class="t">요청 받기</text><text x="500" y="420" text-anchor="middle" class="t">입력 검증</text><text x="500" y="475" text-anchor="middle" class="t">응답 반환</text>
  <rect x="680" y="220" width="300" height="430" rx="28" class="mint stroke2"/><rect x="680" y="220" width="300" height="75" rx="28" class="teal"/><text x="830" y="267" text-anchor="middle" class="h">Service</text>
  <text x="830" y="365" text-anchor="middle" class="t">업무 규칙 처리</text><text x="830" y="420" text-anchor="middle" class="t">주문 금액 계산</text><text x="830" y="475" text-anchor="middle" class="t">Transaction 제어</text>
  <rect x="1010" y="220" width="300" height="430" rx="28" class="pale stroke"/><rect x="1010" y="220" width="300" height="75" rx="28" class="blue"/><text x="1160" y="267" text-anchor="middle" class="h">Repository</text>
  <text x="1160" y="365" text-anchor="middle" class="t">DB 조회 / 저장</text><text x="1160" y="420" text-anchor="middle" class="t">SQLAlchemy 사용</text><text x="1160" y="475" text-anchor="middle" class="t">테이블 접근</text>
  <rect x="1360" y="310" width="190" height="250" rx="26" class="pale stroke"/><text x="1455" y="360" text-anchor="middle" class="t">PostgreSQL</text>
  <path d="M290 435 H350" class="line arrow"/><path d="M650 435 H680" class="line arrow"/><path d="M980 435 H1010" class="line arrow"/><path d="M1310 435 H1360" class="line arrow"/>
  <rect x="250" y="715" width="1100" height="100" rx="28" fill="#eef6ff" class="stroke"/><text x="800" y="754" text-anchor="middle" class="t">왜 나누는가?</text>
  <text x="800" y="792" text-anchor="middle" class="s">유지보수 · 테스트 용이 · 역할 분리 · 재사용성</text>
</svg>