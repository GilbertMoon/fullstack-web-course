<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  
<style>
  .bg{fill:#ffffff}.title{font:700 52px Arial,'Noto Sans KR',sans-serif;fill:#0f2747}
  .sub{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#16365f}
  .h{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:white}
  .t{font:600 24px Arial,'Noto Sans KR',sans-serif;fill:#17324d}
  .s{font:500 20px Arial,'Noto Sans KR',sans-serif;fill:#284965}
  .tiny{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#35536f}
  .blue{fill:#0d6efd}.teal{fill:#16a394}.pale{fill:#edf5ff}.mint{fill:#e9fbf7}
  .stroke{stroke:#195b9b;stroke-width:4}.stroke2{stroke:#139486;stroke-width:4}
  .line{stroke:#164e7e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{marker-end:url(#arrow)} .soft{filter:url(#shadow)}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#164e7e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
</defs><rect class="bg" width="1600" height="900"/>
  <text x="800" y="74" text-anchor="middle" class="title">Chapter 09 · State → Event → Re-render</text>
  <rect x="430" y="95" width="740" height="58" rx="29" fill="#dfeeff"/>
  <text x="800" y="134" text-anchor="middle" class="sub">React가 화면을 갱신하는 기본 흐름</text>
  
  <g class="soft">
    <rect x="50" y="250" width="320" height="310" rx="26" class="pale stroke"/>
    <rect x="420" y="250" width="320" height="310" rx="26" class="pale stroke"/>
    <rect x="790" y="250" width="320" height="310" rx="26" class="mint stroke2"/>
    <rect x="1160" y="250" width="320" height="310" rx="26" class="pale stroke"/>
  </g>
  <text x="210" y="315" text-anchor="middle" class="t">현재 State</text><text x="210" y="385" text-anchor="middle" class="s">cartItems</text><text x="210" y="425" text-anchor="middle" class="s">count · formData</text>
  <rect x="420" y="250" width="320" height="70" rx="26" class="blue"/><text x="580" y="295" text-anchor="middle" class="h">사용자 Event</text><text x="580" y="390" text-anchor="middle" class="t">클릭 · 입력 · 삭제</text>
  <rect x="790" y="250" width="320" height="70" rx="26" class="teal"/><text x="950" y="295" text-anchor="middle" class="h">setState 호출</text><text x="950" y="405" text-anchor="middle" class="t">상태 변경</text>
  <rect x="1160" y="250" width="320" height="70" rx="26" class="blue"/><text x="1320" y="295" text-anchor="middle" class="h">Re-render</text><text x="1320" y="405" text-anchor="middle" class="t">UI 다시 그림</text>
  <path d="M370 405 H420" class="line arrow"/><path d="M740 405 H790" class="line arrow"/><path d="M1110 405 H1160" class="line arrow"/>
  <path d="M1320 560 V650 H210 V560" class="line arrow"/><rect x="650" y="615" width="300" height="54" rx="25" class="blue"/><text x="800" y="650" text-anchor="middle" class="h" font-size="24">업데이트된 State</text>
  <rect x="90" y="730" width="950" height="100" rx="28" fill="#eef7ff" class="stroke"/><text x="565" y="770" text-anchor="middle" class="t">예시: 장바구니 버튼 클릭 → cartItems 증가 → 장바구니 개수 UI 변경</text>
  <rect x="1080" y="700" width="420" height="150" rx="28" class="mint stroke2"/><text x="1290" y="742" text-anchor="middle" class="t">중요</text><text x="1120" y="785" class="s">• state가 바뀌면 화면이 다시 그려짐</text><text x="1120" y="823" class="s">• 직접 DOM 조작보다 선언적</text>
</svg>