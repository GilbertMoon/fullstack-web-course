<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  
<style>
  .bg{fill:#ffffff}.title{font:700 52px Arial,'Noto Sans KR',sans-serif;fill:#0f2747}
  .sub{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#16365f}
  .h{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:white}
  .t{font:600 24px Arial,'Noto Sans KR',sans-serif;fill:#17324d}
  .s{font:500 20px Arial,'Noto Sans KR',sans-serif;fill:#284965}
  .tiny{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#35536f}
  .blue{fill:#0d6efd}.teal{fill:#16a394}.pale{fill:#edf5ff}.mint{fill:#e9fbf7}
  .stroke{stroke:#195b9b;stroke-width:4}.stroke2{stroke:#139486;stroke-width:4}
  .line{stroke:#164e7e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{marker-end:url(#arrow)} .soft{filter:url(#shadow)}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#164e7e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
</defs><rect class="bg" width="1600" height="900"/>
  <text x="800" y="74" text-anchor="middle" class="title">Chapter 09 · 3개 테이블 ERD</text>
  <rect x="430" y="95" width="740" height="58" rx="29" fill="#dfeeff"/>
  <text x="800" y="134" text-anchor="middle" class="sub">products · orders · order_items</text>
  
  <g class="soft">
    <rect x="60" y="220" width="420" height="500" rx="28" class="pale stroke"/>
    <rect x="590" y="220" width="420" height="500" rx="28" class="mint stroke2"/>
    <rect x="1120" y="220" width="420" height="500" rx="28" class="pale stroke"/>
  </g>
  <rect x="60" y="220" width="420" height="74" rx="28" class="blue"/><text x="270" y="266" text-anchor="middle" class="h">products</text>
  <rect x="590" y="220" width="420" height="74" rx="28" class="teal"/><text x="800" y="266" text-anchor="middle" class="h">order_items</text>
  <rect x="1120" y="220" width="420" height="74" rx="28" class="blue"/><text x="1330" y="266" text-anchor="middle" class="h">orders</text>
  <text x="100" y="350" class="t">🔑 product_id (PK)</text><text x="100" y="405" class="t">name</text><text x="100" y="460" class="t">price</text><text x="100" y="515" class="t">category</text><text x="100" y="570" class="t">stock</text>
  <text x="630" y="350" class="t">🔑 id (PK)</text><text x="630" y="405" class="t">🔗 order_id (FK)</text><text x="630" y="460" class="t">🔗 product_id (FK)</text><text x="630" y="515" class="t">quantity</text><text x="630" y="570" class="t">price</text>
  <text x="1160" y="350" class="t">🔑 id (PK)</text><text x="1160" y="405" class="t">total_price</text><text x="1160" y="460" class="t">status</text><text x="1160" y="515" class="t">created_at</text>
  <path d="M480 450 H590" class="line"/><text x="500" y="430" class="t">1</text><text x="560" y="430" class="t">N</text>
  <path d="M1010 450 H1120" class="line"/><text x="1030" y="430" class="t">N</text><text x="1090" y="430" class="t">1</text>
  <rect x="280" y="760" width="1040" height="90" rx="24" fill="#eef9ff" class="stroke"/>
  <text x="800" y="798" text-anchor="middle" class="t">핵심: order_items가 주문과 상품을 연결합니다.</text>
  <text x="800" y="831" text-anchor="middle" class="s">orders 1:N order_items · products 1:N order_items</text>
</svg>