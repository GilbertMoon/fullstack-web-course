<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  
<style>
  .bg{fill:#ffffff}.title{font:700 52px Arial,'Noto Sans KR',sans-serif;fill:#0f2747}
  .sub{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#16365f}
  .h{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:white}
  .t{font:600 24px Arial,'Noto Sans KR',sans-serif;fill:#17324d}
  .s{font:500 20px Arial,'Noto Sans KR',sans-serif;fill:#284965}
  .tiny{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#35536f}
  .blue{fill:#0d6efd}.teal{fill:#16a394}.pale{fill:#edf5ff}.mint{fill:#e9fbf7}
  .stroke{stroke:#195b9b;stroke-width:4}.stroke2{stroke:#139486;stroke-width:4}
  .line{stroke:#164e7e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{marker-end:url(#arrow)} .soft{filter:url(#shadow)}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#164e7e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
</defs><rect class="bg" width="1600" height="900"/>
  <text x="800" y="74" text-anchor="middle" class="title">Chapter 09 · 전체 시스템 아키텍처</text>
  <rect x="430" y="95" width="740" height="58" rx="29" fill="#dfeeff"/>
  <text x="800" y="134" text-anchor="middle" class="sub">React / FastAPI / PostgreSQL / 테스트</text>
  
  <g class="soft">
    <rect x="40" y="205" width="320" height="390" rx="28" class="pale stroke"/>
    <rect x="400" y="205" width="320" height="390" rx="28" class="pale stroke"/>
    <rect x="760" y="205" width="320" height="390" rx="28" class="mint stroke2"/>
    <rect x="1120" y="205" width="320" height="390" rx="28" class="pale stroke"/>
  </g>
  <rect x="40" y="205" width="320" height="74" rx="28" class="blue"/><text x="200" y="252" text-anchor="middle" class="h">사용자 브라우저</text>
  <rect x="400" y="205" width="320" height="74" rx="28" class="blue"/><text x="560" y="244" text-anchor="middle" class="h">React / Next.js</text><text x="560" y="272" text-anchor="middle" class="tiny" fill="white">프론트엔드</text>
  <rect x="760" y="205" width="320" height="74" rx="28" class="teal"/><text x="920" y="244" text-anchor="middle" class="h">FastAPI</text><text x="920" y="272" text-anchor="middle" class="tiny" fill="white">백엔드</text>
  <rect x="1120" y="205" width="320" height="74" rx="28" class="blue"/><text x="1280" y="252" text-anchor="middle" class="h">PostgreSQL DB</text>
  <text x="200" y="350" text-anchor="middle" class="t">페이지 이동 · 폼 입력</text><text x="200" y="395" text-anchor="middle" class="t">버튼 클릭</text>
  <text x="560" y="350" text-anchor="middle" class="t">Component</text><text x="560" y="395" text-anchor="middle" class="t">State · Event</text><text x="560" y="440" text-anchor="middle" class="t">Rendering</text>
  <text x="920" y="350" text-anchor="middle" class="t">Router</text><text x="920" y="395" text-anchor="middle" class="t">Service</text><text x="920" y="440" text-anchor="middle" class="t">Repository</text>
  <text x="1280" y="350" text-anchor="middle" class="t">products</text><text x="1280" y="395" text-anchor="middle" class="t">orders</text><text x="1280" y="440" text-anchor="middle" class="t">order_items</text>
  <path d="M360 400 H400" class="line arrow"/><path d="M720 400 H760" class="line arrow"/><path d="M1080 400 H1120" class="line arrow"/>
  <rect x="555" y="625" width="490" height="70" rx="28" fill="#dbeeff" class="stroke"/>
  <text x="800" y="655" text-anchor="middle" class="t">REST API · JSON</text><text x="800" y="684" text-anchor="middle" class="s">Frontend ↔ Backend 통신</text>
  <rect x="90" y="730" width="430" height="90" rx="24" class="mint stroke2"/><text x="305" y="770" text-anchor="middle" class="t">Playwright · E2E 테스트</text><text x="305" y="802" text-anchor="middle" class="s">브라우저 사용자 흐름 검증</text>
  <rect x="1080" y="730" width="430" height="90" rx="24" class="mint stroke2"/><text x="1295" y="770" text-anchor="middle" class="t">pytest · API/로직 테스트</text><text x="1295" y="802" text-anchor="middle" class="s">Backend 규칙과 응답 검증</text>
  <text x="800" y="860" text-anchor="middle" class="sub">조회 → 장바구니 → 주문 → 검증</text>
</svg>