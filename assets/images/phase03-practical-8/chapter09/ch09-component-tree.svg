<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  
<style>
  .bg{fill:#ffffff}.title{font:700 52px Arial,'Noto Sans KR',sans-serif;fill:#0f2747}
  .sub{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#16365f}
  .h{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:white}
  .t{font:600 24px Arial,'Noto Sans KR',sans-serif;fill:#17324d}
  .s{font:500 20px Arial,'Noto Sans KR',sans-serif;fill:#284965}
  .tiny{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#35536f}
  .blue{fill:#0d6efd}.teal{fill:#16a394}.pale{fill:#edf5ff}.mint{fill:#e9fbf7}
  .stroke{stroke:#195b9b;stroke-width:4}.stroke2{stroke:#139486;stroke-width:4}
  .line{stroke:#164e7e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{marker-end:url(#arrow)} .soft{filter:url(#shadow)}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#164e7e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
</defs><rect class="bg" width="1600" height="900"/>
  <text x="800" y="74" text-anchor="middle" class="title">Chapter 09 · React Component Tree</text>
  <rect x="430" y="95" width="740" height="58" rx="29" fill="#dfeeff"/>
  <text x="800" y="134" text-anchor="middle" class="sub">컴포넌트 분리로 UI를 조립하기</text>
  
  <rect x="595" y="190" width="410" height="105" rx="24" class="blue"/><text x="800" y="242" text-anchor="middle" class="h">App</text><text x="800" y="276" text-anchor="middle" class="tiny" fill="white">최상위 컴포넌트</text>
  <rect x="130" y="380" width="360" height="100" rx="24" class="pale stroke"/><text x="310" y="438" text-anchor="middle" class="t">Layout</text>
  <rect x="620" y="355" width="430" height="125" rx="24" class="mint stroke2"/><text x="835" y="410" text-anchor="middle" class="t">ProductPage</text><text x="835" y="445" text-anchor="middle" class="s">상품 목록 · 장바구니 · 주문</text>
  <path d="M800 295 V335 H310 V380" class="line arrow"/><path d="M800 295 V355" class="line arrow"/>
  <rect x="420" y="575" width="300" height="95" rx="22" class="pale stroke"/><text x="570" y="632" text-anchor="middle" class="t">ProductList</text>
  <rect x="750" y="575" width="300" height="95" rx="22" class="mint stroke2"/><text x="900" y="632" text-anchor="middle" class="t">CartPanel</text>
  <rect x="1080" y="575" width="300" height="95" rx="22" class="pale stroke"/><text x="1230" y="632" text-anchor="middle" class="t">OrderForm</text>
  <path d="M835 480 V530 H570 V575" class="line arrow"/><path d="M835 480 V575" class="line arrow"/><path d="M835 480 V530 H1230 V575" class="line arrow"/>
  <rect x="455" y="735" width="230" height="80" rx="20" fill="#f5faff" class="stroke"/><text x="570" y="783" text-anchor="middle" class="t">ProductCard</text>
  <rect x="785" y="735" width="230" height="80" rx="20" fill="#f3fffb" class="stroke2"/><text x="900" y="783" text-anchor="middle" class="t">CartItem</text>
  <path d="M570 670 V735" class="line arrow"/><path d="M900 670 V735" class="line arrow"/>
  <rect x="1150" y="230" width="360" height="250" rx="28" fill="#eef5ff" class="stroke"/><text x="1330" y="275" text-anchor="middle" class="t">핵심 포인트</text>
  <text x="1190" y="325" class="s">• 큰 화면을 작은 컴포넌트로 분리</text><text x="1190" y="370" class="s">• props로 데이터 전달</text><text x="1190" y="415" class="s">• state는 필요한 곳에서 관리</text><text x="1190" y="460" class="s">• 재사용 가능한 UI 구성</text>
</svg>