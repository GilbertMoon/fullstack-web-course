<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  
<style>
  .bg{fill:#ffffff}.title{font:700 52px Arial,'Noto Sans KR',sans-serif;fill:#0f2747}
  .sub{font:700 28px Arial,'Noto Sans KR',sans-serif;fill:#16365f}
  .h{font:700 30px Arial,'Noto Sans KR',sans-serif;fill:white}
  .t{font:600 24px Arial,'Noto Sans KR',sans-serif;fill:#17324d}
  .s{font:500 20px Arial,'Noto Sans KR',sans-serif;fill:#284965}
  .tiny{font:500 18px Arial,'Noto Sans KR',sans-serif;fill:#35536f}
  .blue{fill:#0d6efd}.teal{fill:#16a394}.pale{fill:#edf5ff}.mint{fill:#e9fbf7}
  .stroke{stroke:#195b9b;stroke-width:4}.stroke2{stroke:#139486;stroke-width:4}
  .line{stroke:#164e7e;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{marker-end:url(#arrow)} .soft{filter:url(#shadow)}
</style>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#164e7e"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter>
</defs><rect class="bg" width="1600" height="900"/>
  <text x="800" y="74" text-anchor="middle" class="title">Chapter 09 · pytest vs Playwright</text>
  <rect x="430" y="95" width="740" height="58" rx="29" fill="#dfeeff"/>
  <text x="800" y="134" text-anchor="middle" class="sub">무엇을 어디까지 검증할까?</text>
  
  <rect x="60" y="220" width="700" height="380" rx="30" class="pale stroke"/><rect x="60" y="220" width="700" height="80" rx="30" class="blue"/><text x="410" y="272" text-anchor="middle" class="h">pytest</text>
  <text x="120" y="365" class="t">• 백엔드 함수 / 로직 테스트</text><text x="120" y="425" class="t">• API 응답 검증</text><text x="120" y="485" class="t">• 빠르고 반복 실행에 유리</text><text x="120" y="545" class="t">• 예: 주문 생성 API 테스트</text>
  <rect x="840" y="220" width="700" height="380" rx="30" class="mint stroke2"/><rect x="840" y="220" width="700" height="80" rx="30" class="teal"/><text x="1190" y="272" text-anchor="middle" class="h">Playwright</text>
  <text x="900" y="365" class="t">• 브라우저 기반 E2E 테스트</text><text x="900" y="425" class="t">• 실제 사용자 흐름 검증</text><text x="900" y="485" class="t">• 클릭 · 입력 · 화면 확인</text><text x="900" y="545" class="t">• 예: 상품 조회 → 주문 완료</text>
  <rect x="120" y="660" width="1360" height="170" rx="28" fill="#f5faff" class="stroke"/>
  <text x="320" y="710" text-anchor="middle" class="t">pytest</text><text x="800" y="710" text-anchor="middle" class="t">비교 기준</text><text x="1280" y="710" text-anchor="middle" class="t">Playwright</text>
  <text x="320" y="760" text-anchor="middle" class="s">코드 / 로직</text><text x="800" y="760" text-anchor="middle" class="s">대상</text><text x="1280" y="760" text-anchor="middle" class="s">브라우저 / 사용자 흐름</text>
  <text x="320" y="805" text-anchor="middle" class="s">빠름 · 정확한 기능 검증</text><text x="800" y="805" text-anchor="middle" class="s">목적</text><text x="1280" y="805" text-anchor="middle" class="s">전체 흐름 검증</text>
</svg>