<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850"><rect width="1440" height="850" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.t{font-size:43px;font-weight:800;fill:#10213c}.h{font-size:27px;font-weight:700;fill:#10213c}.b{font-size:21px;fill:#334155}.m{font-size:19px;fill:#4338ca}</style><text x="78" y="83" class="t">7강 — API 오류 추적의 올바른 순서</text><text x="78" y="129" class="b">오류가 발생한 위치를 확인한 다음 수정합니다. Backend나 DB를 먼저 재작성하지 않습니다.</text><rect x="72" y="195" width="1296" height="525" rx="28" fill="white" stroke="#cbd5e1" stroke-width="3"/><rect x="110" y="259" width="254" height="300" rx="20" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/><text x="237" y="321" text-anchor="middle" class="h">① Browser</text><text x="237" y="379" text-anchor="middle" class="b">주소·클릭 확인</text><text x="237" y="427" text-anchor="middle" class="b">Console 확인</text><text x="237" y="475" text-anchor="middle" class="b">Loading / Error</text><rect x="420" y="259" width="254" height="300" rx="20" fill="#ede9fe" stroke="#c4b5fd" stroke-width="3"/><text x="547" y="321" text-anchor="middle" class="h">② Network</text><text x="547" y="379" text-anchor="middle" class="b">Method · URL</text><text x="547" y="427" text-anchor="middle" class="b">Status · 응답</text><text x="547" y="475" text-anchor="middle" class="b">CORS 확인</text><rect x="730" y="259" width="254" height="300" rx="20" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/><text x="857" y="321" text-anchor="middle" class="h">③ FastAPI</text><text x="857" y="379" text-anchor="middle" class="b">Swagger 비교</text><text x="857" y="427" text-anchor="middle" class="b">Path · Schema</text><text x="857" y="475" text-anchor="middle" class="b">서버 로그</text><rect x="1040" y="259" width="290" height="300" rx="20" fill="#dcfce7" stroke="#86efac" stroke-width="3"/><text x="1185" y="321" text-anchor="middle" class="h">④ PostgreSQL</text><text x="1185" y="379" text-anchor="middle" class="b">테스트 데이터</text><text x="1185" y="427" text-anchor="middle" class="b">조회 결과 비교</text><text x="1185" y="475" text-anchor="middle" class="b">원본 임의 삭제 금지</text><path d="M370 410h43m265 0h43m268 0h43" stroke="#6366f1" stroke-width="6"/><text x="720" y="646" text-anchor="middle" class="h">증빙: Browser + Network + Swagger + DB + Type Check / Build</text><text x="78" y="788" class="b">학습용 개념도. CORS 정책은 브라우저에서 확인하며 서버 호출 성공과 별개입니다.</text></svg>