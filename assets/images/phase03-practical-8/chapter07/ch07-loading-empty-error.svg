<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840"><rect width="1440" height="840" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.t{font-size:43px;font-weight:800;fill:#10213c}.h{font-size:27px;font-weight:700;fill:#10213c}.b{font-size:21px;fill:#334155}.m{font-size:19px;fill:#4338ca}</style><text x="76" y="84" class="t">7강 — API 조회 상태별 화면 확인</text><text x="76" y="132" class="b">GET 요청이 성공했는지와 데이터가 있는지를 구분해 사용자에게 정확히 안내합니다.</text><rect x="74" y="212" width="409" height="455" rx="25" fill="white" stroke="#93c5fd" stroke-width="3"/><rect x="74" y="212" width="409" height="88" rx="25" fill="#dbeafe"/><text x="279" y="270" text-anchor="middle" class="h">Loading</text><text x="111" y="361" class="b">회원 목록을 불러오는 중...</text><circle cx="280" cy="465" r="57" fill="none" stroke="#dbeafe" stroke-width="16"/><path d="M280 408A57 57 0 0 1 337 465" fill="none" stroke="#2563eb" stroke-width="16"/><text x="279" y="587" text-anchor="middle" class="b">요청 결과 대기 중</text><rect x="515" y="212" width="409" height="455" rx="25" fill="white" stroke="#a7f3d0" stroke-width="3"/><rect x="515" y="212" width="409" height="88" rx="25" fill="#d1fae5"/><text x="720" y="270" text-anchor="middle" class="h">Empty</text><text x="720" y="383" text-anchor="middle" class="b">회원 목록 (0명)</text><text x="720" y="444" text-anchor="middle" class="b">등록된 회원이 없습니다.</text><text x="720" y="577" text-anchor="middle" class="b">HTTP 성공 + 빈 배열 []</text><rect x="956" y="212" width="409" height="455" rx="25" fill="white" stroke="#fecaca" stroke-width="3"/><rect x="956" y="212" width="409" height="88" rx="25" fill="#fee2e2"/><text x="1160" y="270" text-anchor="middle" class="h">Error</text><text x="1160" y="383" text-anchor="middle" class="b">조회 오류가 발생했습니다.</text><text x="1160" y="445" text-anchor="middle" class="b">원인 확인 후 다시 조회</text><text x="1160" y="577" text-anchor="middle" class="b">네트워크·CORS·응답 불일치</text><text x="80" y="755" class="b">설명용 상태 비교. 실제 Network 캡처와 TypeScript·Build 통과 증거는 학생 PC에서 확보합니다.</text></svg>