eScript · ESLint · Build</text><text x="790" y="582" class="s">실제 명령의 종료 결과 기록</text><line x1="116" y1="609" x2="1325" y2="609" stroke="#e2e8f0" stroke-width="2"/><rect x="118" y="621" width="38" height="38" rx="8" fill="white" stroke="#94a3b8" stroke-width="3"/><text x="178" y="649" class="b">GitHub 커밋·제출</text><text x="790" y="649" class="s">원격·브랜치 확인 후 올바른 URL 제출</text><line x1="116" y1="676" x2="1325" y2="676" stroke="#e2e8f0" stroke-width="2"/><text x="79" y="795" class="b">주의: 개인정보·토큰·DB 비밀번호·.env.local을 공개 저장소에 올리지 않습니다.</text></svg>