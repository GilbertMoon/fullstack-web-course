<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="790" viewBox="0 0 1440 790"><rect width="1440" height="790" fill="#f8fafc"/><style>text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif}.t{font-weight:800;font-size:45px;fill:#0f172a}.h{font-weight:750;font-size:29px;fill:#0f172a}.s{font-size:22px;fill:#334155}.b{font-size:19px;fill:#475569}</style><text x="67" y="84" class="t">5강 — 회원 CRUD 요청과 목록 갱신</text><text x="67" y="129" class="s">사용자 동작 → FastAPI → PostgreSQL → GET 재조회 → 최신 화면</text><rect x="55" y="200" width="390" height="320" rx="25" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/><text x="250" y="260" class="h" text-anchor="middle">Next.js · React</text><text x="250" y="313" class="s" text-anchor="middle">등록 폼 / 수정 / 삭제</text><text x="250" y="362" class="s" text-anchor="middle">POST · PUT · DELETE</text><text x="250" y="411" class="s" text-anchor="middle">동작 결과·오류 안내</text><rect x="527" y="200" width="390" height="320" rx="25" fill="#ede9fe" stroke="#a78bfa" stroke-width="3"/><text x="722" y="260" class="h" text-anchor="middle">FastAPI</text><text x="722" y="318" class="s" text-anchor="middle">API 요청 검증</text><text x="722" y="366" class="s" text-anchor="middle">저장·수정·삭제 실행</text><text x="722" y="412" class="s" text-anchor="middle">HTTP 결과 응답</text><rect x="999" y="200" width="390" height="320" rx="25" fill="#dcfce7" stroke="#86efac" stroke-width="3"/><text x="1194" y="260" class="h" text-anchor="middle">PostgreSQL</text><text x="1194" y="320" class="s" text-anchor="middle">실제 데이터 변경</text><text x="1194" y="376" class="s" text-anchor="middle">회원 정보 영구 반영</text><path d="M445 332H522M917 332H993" stroke="#6366f1" stroke-width="6"/><path d="M509 320L522 332L509 344M980 320L993 332L980 344" stroke="#6366f1" fill="none" stroke-width="5"/><rect x="85" y="568" width="1268" height="112" rx="20" fill="white" stroke="#cbd5e1" stroke-width="3"/><text x="719" y="611" class="h" text-anchor="middle">변경 후 GET /members 다시 조회</text><text x="719" y="652" class="s" text-anchor="middle">서버가 반환한 최신 회원 목록으로 화면 갱신 · 실제 확인 전에는 성공 표시 금지</text><text x="71" y="744" class="b">학습용 개념도 · 경로/요청 JSON은 학생 본인의 Swagger API 계약에 맞춰 확인해야 합니다.</text></svg>